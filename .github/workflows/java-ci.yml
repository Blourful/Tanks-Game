name: Java CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run tests and build JAR
        run: xvfb-run --auto-servernum gradle clean test jar

      - name: Upload JAR artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tanks-game-jar
          path: build/libs/*.jar

      - name: Package Windows ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p package/Tanks-Game/src/main/resources
          cp build/libs/*.jar package/Tanks-Game/Tanks-1.0.jar
          cp config.json level1.txt level2.txt level3.txt level4.txt run.bat package/Tanks-Game/
          cp -r src/main/resources/Tanks package/Tanks-Game/src/main/resources/
          cd package
          zip -r "Tanks-Game-${GITHUB_REF_NAME}-windows.zip" Tanks-Game

      - name: Upload Windows ZIP artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tanks-game-windows
          path: package/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/*.jar package/*.zip \
            --title "Tanks Game ${GITHUB_REF_NAME}" \
            --generate-notes
